            price: 15,

        }
    ];
    
    // Guardar productos por defecto la primera vez
    localStorage.setItem('productos_jjj', JSON.stringify(defaultProducts));
    return defaultProducts;
}

// Función para formatear precio
function formatPrice(price) {
    return (price * 1000).toLocaleString('es-CO');
}

// Función para limpiar nombres para JavaScript
function cleanName(name) {
    return name.replace(/[^a-zA-Z0-9\s]/g, '').replace(/\s+/g, ' ').trim();
}

// Función para renderizar productos dinámicamente
function renderDynamicProducts() {
    const productos = loadProductsFromStorage();
    const productList = document.querySelector('.product-list');
    
    if (!productList) {
        console.error('No se encontró el contenedor .product-list');
        return;
    }
    
    // Limpiar productos existentes
    productList.innerHTML = '';
    
    // Crear productos dinámicamente
    productos.forEach(producto => {
        const productDiv = document.createElement('div');
        productDiv.className = 'product';
        
        productDiv.innerHTML = `
            <img src="${producto.image}" alt="${producto.name}" onerror="this.src='https://via.placeholder.com/300x200?text=Sin+Imagen'">
            <h2>${producto.name}</h2>
            <p class="price">$${formatPrice(producto.price)}</p>
            <button onclick="addToCart('${cleanName(producto.name)}', ${producto.price})">
                <i class="fas fa-shopping-cart"></i> Agregar al Carrito
            </button>
        `;
        
        productList.appendChild(productDiv);
    });
    
    console.log(`Se cargaron ${productos.length} productos dinámicamente`);
}

// Función para detectar cambios y actualizar automáticamente
function watchStorageChanges() {
    // Verificar cambios cada 2 segundos
    setInterval(function() {
        const currentData = localStorage.getItem('productos_jjj');
        if (currentData !== window.lastProductData) {
            window.lastProductData = currentData;
            renderDynamicProducts();
            console.log('Productos actualizados automáticamente');
        }
    }, 2000);
}

// Función removida - no se muestra botón admin a los clientes

// Inicializar cuando se carga la página
document.addEventListener('DOMContentLoaded', function() {
    console.log('Iniciando carga de productos dinámicos...');
    
    // Esperar un poco para asegurar que el DOM esté completamente cargado
    setTimeout(function() {
        renderDynamicProducts();
        watchStorageChanges();
        
        // Guardar datos iniciales para comparación
        window.lastProductData = localStorage.getItem('productos_jjj');
    }, 500);
});
</script>
